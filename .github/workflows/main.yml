name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: xcode-27
    steps:
    - name: Check out
      uses: actions/checkout@v7
    - name: Select Xcode 27.2
      run: sudo xcode-select -s /Applications/Xcode_27.2.app
    - name: Show the toolchain
      run: swift --version
    - name: Running the tests
      run: swift test
    - name: Building a Universal xcinfo
      run: make
    - name: Installing
      run: sudo make install
    - name: Testing archs
      run: lipo -archs /usr/local/bin/xcinfo
